# antec-flux-pro-display: which sensors to put on the case display.
#
# Names come from `antec-flux-pro-display --list-sensors` (or `sensors`): the device
# is the chip name before the bus part (-pci-, -isa-, -i2c-, ...), the type is the
# label of a temperature. Matching is case-insensitive and by prefix. After editing:
#   sudo systemctl restart antec-flux-pro-display
#
# Common values
#   AMD CPU     cpu_device=k10temp   cpu_temp_type=tctl
#   Intel CPU   cpu_device=coretemp  cpu_temp_type=package id 0
#   AMD GPU     gpu_device=amdgpu    gpu_temp_type=edge   (or junction)
#   NVIDIA      the proprietary and nvidia-open drivers expose no hwmon sensor, so
#               libsensors cannot read them; only nouveau works here.

cpu_device=k10temp
cpu_temp_type=tctl

gpu_device=amdgpu
gpu_temp_type=edge

# If two devices share a name (an AMD CPU with its iGPU enabled plus a discrete AMD
# card gives two "amdgpu" chips, and the daemon warns which it picked), pin the one
# you want by PCI vendor and device ID; --list-sensors shows them as [vendor:device].
# cpu_vendor_id and cpu_device_id exist too, for a duplicate CPU name.
#gpu_vendor_id=1002
#gpu_device_id=7550

# If only one temperature shows, press the "Temp" button on the top I/O strip: it cycles
# the panel through CPU&GPU, CPU, GPU and off, independently of this daemon.

# Milliseconds between frames, minimum 100. Antec's own software sends one per
# second. The panel blanks a few seconds after frames stop, so much longer intervals
# make it flicker; shorter ones gain nothing, as sensors update about once a second.
update_interval=1000
